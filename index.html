<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Intelligence AI</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #050505;
    --card-bg: rgba(20, 20, 22, 0.7);
    --primary: #00E5FF;
    --primary-glow: rgba(0, 229, 255, 0.4);
    --secondary: #7C3AED;
    --text-main: #FFFFFF;
    --text-muted: #A1A1AA;
    --border: rgba(255, 255, 255, 0.1);
    --success: #10B981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.15), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(0, 229, 255, 0.15), transparent 25%);
    background-attachment: fixed;
    padding: 60px 20px;
  }

  main {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  header {
    text-align: center;
    animation: fadeInDown 0.8s ease-out;
  }

  h1 {
    font-size: 3rem;
    font-weight: 800;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--text-main) 0%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 1.1rem;
    font-weight: 300;
  }

  .search-container {
    position: relative;
    width: 100%;
    animation: fadeInUp 0.8s ease-out 0.2s both;
  }

  form {
    display: flex;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    transition: all 0.3s ease;
  }

  form:focus-within {
    border-color: var(--primary);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px var(--primary-glow);
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    padding: 16px 24px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 1.2rem;
    outline: none;
  }

  input[type="text"]::placeholder {
    color: var(--text-muted);
  }

  button {
    background: linear-gradient(135deg, var(--secondary), var(--primary));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 32px;
    font-family: inherit;
    font-weight: 600;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px var(--primary-glow);
  }

  button:disabled {
    background: #333;
    color: #888;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .trace-container {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.5s ease-out;
  }

  .trace-container.active {
    display: block;
  }

  .trace-title {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--primary);
    margin-bottom: 20px;
    font-weight: 600;
  }

  .trace {
    position: relative;
    padding-left: 30px;
  }

  .trace::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 7px;
    width: 2px;
    background: var(--border);
  }

  .step {
    position: relative;
    padding: 10px 0;
    color: var(--text-muted);
    font-size: 1.1rem;
    transition: color 0.3s;
  }

  .step::before {
    content: '';
    position: absolute;
    left: -30px;
    top: 18px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg-color);
    border: 2px solid var(--border);
    transform: translateY(-50%);
    transition: all 0.3s;
    z-index: 1;
  }

  .step.live {
    color: var(--text-main);
  }

  .step.live::before {
    border-color: var(--primary);
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary-glow);
    animation: pulse 1.5s infinite;
  }

  .step.complete {
    color: var(--text-main);
  }

  .step.complete::before {
    border-color: var(--success);
    background: var(--success);
  }

  .report-container {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    backdrop-filter: blur(12px);
    animation: slideUp 0.6s ease-out;
  }

  .report-container.active {
    display: block;
  }

  .report-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .report-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--primary);
  }

  .report-content {
    white-space: pre-wrap;
    line-height: 1.7;
    font-size: 1.05rem;
    color: #e4e4e7;
  }

  .error {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #EF4444;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    animation: fadeIn 0.3s;
  }

  /* Animations */
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(0, 229, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
  }

</style>
</head>
<body>

<main>
  <header>
    <h1>Product Intelligence AI</h1>
    <p class="subtitle">Enter a product name to analyze market prices across Daraz & OLX</p>
  </header>

  <div class="search-container">
    <form id="research-form">
      <input type="text" id="product-input" placeholder="e.g. iPhone 15 Pro Max 256GB" autocomplete="off" required>
      <button type="submit" id="submit-btn">Analyze</button>
    </form>
  </div>

  <div class="error" id="error"></div>

  <div class="trace-container" id="trace-container">
    <div class="trace-title">Analysis Pipeline Activity</div>
    <div class="trace" id="trace"></div>
  </div>

  <div class="report-container" id="report-container">
    <div class="report-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <div class="report-title">Market Intelligence Report</div>
    </div>
    <div class="report-content" id="report-text"></div>
  </div>
</main>

<script>
  const API_URL = "http://localhost:8000/api/research";

  const form = document.getElementById("research-form");
  const input = document.getElementById("product-input");
  const submitBtn = document.getElementById("submit-btn");
  const traceContainer = document.getElementById("trace-container");
  const trace = document.getElementById("trace");
  const errorBox = document.getElementById("error");
  const reportContainer = document.getElementById("report-container");
  const reportText = document.getElementById("report-text");

  // friendly labels for nodes
  const STEP_LABELS = {
    daraz: "Scraping Daraz for product listings",
    olx: "Scraping OLX for classifieds",
    ddgs: "Searching DuckDuckGo for context",
    merge: "Merging & analyzing price points",
    new_report: "Compiling New Product Report",
    used_report: "Compiling Used/Refurbished Report",
  };

  function resetUI() {
    trace.innerHTML = "";
    traceContainer.classList.remove("active");
    reportContainer.classList.remove("active");
    errorBox.style.display = "none";
    reportText.textContent = "";
  }

  function addStep(status) {
    const live = trace.querySelector(".step.live");
    if (live) {
      live.classList.remove("live");
      live.classList.add("complete");
    }

    const label = STEP_LABELS[status] || status;
    const el = document.createElement("div");
    el.className = "step live";
    el.textContent = label;
    trace.appendChild(el);
  }

  function finishSteps() {
    const live = trace.querySelector(".step.live");
    if (live) {
      live.classList.remove("live");
      live.classList.add("complete");
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const productName = input.value.trim();
    if (!productName) return;

    resetUI();
    traceContainer.classList.add("active");
    submitBtn.disabled = true;
    submitBtn.textContent = "Analyzing...";

    const url = `${API_URL}?product_name=${encodeURIComponent(productName)}`;
    const source = new EventSource(url);

    source.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.done) {
        finishSteps();
        reportText.textContent = data.report || "No final report was generated.";
        reportContainer.classList.add("active");
        submitBtn.disabled = false;
        submitBtn.textContent = "Analyze";
        source.close();
        
        // Scroll to report
        setTimeout(() => {
          reportContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
        return;
      }

      addStep(data.status);
    };

    source.onerror = () => {
      errorBox.textContent = "Connection lost — make sure the FastAPI backend is running on localhost:8000.";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Analyze";
      source.close();
    };
  });
</script>

</body>
</html>
